name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tg_bot
          POSTGRES_USER: tg_bot
          POSTGRES_PASSWORD: tg_bot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tg_bot -d tg_bot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://tg_bot:tg_bot@localhost:5432/tg_bot
      REDIS_URL: redis://localhost:6379/0
      AI_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: pytest --cov=app --cov-report=term-missing
      - run: alembic upgrade head
      - run: alembic check
      - run: docker compose config
      - run: docker build .

